<style type="text/css">
 :root {
    --bg: #0b0d10;
    --panel: rgba(20, 23, 28, 0.92);
    --border: #2a2f37;
    --text: #e6e8eb;
    --muted: #8b929c;
    --accent: #5fd0ff;
  }
/* --- Menu toggle button --- */
  #menu-toggle {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  #menu-toggle:hover { border-color: var(--accent); }

  /* --- Menu panel --- */
  #menu {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 9;
    width: 200px;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    backdrop-filter: blur(6px);
    transform: translateX(-110%);
    opacity: 0;
    transition: transform 0.18s ease, opacity 0.18s ease;
    pointer-events: none;
  }
  #menu.open {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  #menu h2 {
    margin: 0 0 12px 56px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .lang-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    box-sizing: border-box;
    background: #161a1f;
    border: 1px solid var(--border);
           s color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .lang-option:last-child { margin-bottom: 0; }
  .lang-option:hover { border-color: var(--accent); }
  .lang-option.active {
    border-color: var(--accent);
    background: #11202a;
  }
  .lang-option .flag { font-size: 16px; }
  .lang-option .check {
    margin-left: auto;
    color: var(--accent);
    visibility: hidden;
  }
  .lang-option.active .check { visibility: visible; }


body {
