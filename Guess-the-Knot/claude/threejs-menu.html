<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Scene with Menu</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: rgba(20, 23, 28, 0.85);
    --border: #2a2f37;
    --text: #e6e8eb;
    --muted: #8b929c;
    --accent: #5fd0ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  canvas { display: block; }
  #app { position: relative; width: 100vw; height: 100vh; }

  /* --- Menu toggle button --- */
  #menu-toggle {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  #menu-toggle:hover { border-color: var(--accent); }

  /* --- Menu panel --- */
  #menu {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 9;
    width: 230px;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    backdrop-filter: blur(6px);
    transform: translateX(-110%);
    opacity: 0;
    transition: transform 0.18s ease, opacity 0.18s ease;
    pointer-events: none;
  }
  #menu.open {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  #menu h2 {
    margin: 0 0 12px 56px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .row { margin-bottom: 12px; }
  .row label {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
  }
  .row select,
  .row input[type="range"],
  .row input[type="color"],
  .row button {
    width: 100%;
    box-sizing: border-box;
    background: #161a1f;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 6px;
    font-size: 12px;
  }
  .row button {
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .row button:hover { border-color: var(--accent); }
  .checkbox-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .checkbox-row label { margin-bottom: 0; }
  .value {
    float: right;
    color: var(--accent);
  }
</style>
</head>
<body>

<div id="app">
  <button id="menu-toggle" title="Toggle menu">☰</button>

  <div id="menu">
    <h2>Scene controls</h2>

    <div class="row">
      <label for="geometry">Geometry</label>
      <select id="geometry">
        <option value="box">Box</option>
        <option value="sphere">Sphere</option>
        <option value="torus">Torus</option>
        <option value="torusKnot">Torus knot</option>
      </select>
    </div>

    <div class="row checkbox-row">
      <label for="wireframe">Wireframe</label>
      <input type="checkbox" id="wireframe">
    </div>

    <div class="row">
      <label for="color">Color</label>
      <input type="color" id="color" value="#5fd0ff">
    </div>

    <div class="row">
      <label for="speed">Rotation speed <span class="value" id="speedValue">1.0</span></label>
      <input type="range" id="speed" min="0" max="5" step="0.1" value="1">
    </div>

    <div class="row">
      <button id="resetView">Reset camera</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Basic scene setup ---
const app = document.getElementById('app');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3, 2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(4, 5, 3);
scene.add(dirLight);

// --- The object the menu controls ---
let mesh;
const state = {
  geometry: 'box',
  wireframe: false,
  color: '#5fd0ff',
  speed: 1.0,
};

function buildGeometry(type) {
  switch (type) {
    case 'sphere': return new THREE.SphereGeometry(1.2, 32, 32);
    case 'torus': return new THREE.TorusGeometry(1, 0.4, 16, 64);
    case 'torusKnot': return new THREE.TorusKnotGeometry(1, 0.3, 128, 16);
    default: return new THREE.BoxGeometry(1.6, 1.6, 1.6);
  }
}

function rebuildMesh() {
  if (mesh) {
    scene.remove(mesh);
    mesh.geometry.dispose();
    mesh.material.dispose();
  }
  const geometry = buildGeometry(state.geometry);
  const material = new THREE.MeshStandardMaterial({
    color: state.color,
    wireframe: state.wireframe,
    roughness: 0.4,
    metalness: 0.1,
  });
  mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);
}
rebuildMesh();

// --- Render loop ---
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  mesh.rotation.x += dt * 0.4 * state.speed;
  mesh.rotation.y += dt * 0.6 * state.speed;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// =========================================================
// Menu wiring — this is the part that adds the menu itself
// =========================================================
const menu = document.getElementById('menu');
const menuToggle = document.getElementById('menu-toggle');

menuToggle.addEventListener('click', () => {
  menu.classList.toggle('open');
});

document.getElementById('geometry').addEventListener('change', (e) => {
  state.geometry = e.target.value;
  rebuildMesh();
});

document.getElementById('wireframe').addEventListener('change', (e) => {
  state.wireframe = e.target.checked;
  mesh.material.wireframe = state.wireframe;
});

document.getElementById('color').addEventListener('input', (e) => {
  state.color = e.target.value;
  mesh.material.color.set(state.color);
});

const speedInput = document.getElementById('speed');
const speedValue = document.getElementById('speedValue');
speedInput.addEventListener('input', (e) => {
  state.speed = parseFloat(e.target.value);
  speedValue.textContent = state.speed.toFixed(1);
});

document.getElementById('resetView').addEventListener('click', () => {
  camera.position.set(3, 2, 5);
  controls.target.set(0, 0, 0);
  controls.update();
});
</script>
</body>
</html>
